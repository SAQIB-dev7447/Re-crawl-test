<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Re-Crawl Test Page</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f0f4f8, #d9e4ec);
      margin: 0;
      padding: 0;
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: 60px auto;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
      font-size: 2.2em;
    }

    p {
      font-size: 1.1em;
      line-height: 1.6;
      margin: 12px 0;
    }

    strong {
      color: #1a73e8;
    }

    .highlight {
      background: #eaf4ff;
      padding: 10px;
      border-radius: 8px;
      margin: 20px 0;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.9em;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Company Information</h1>

    <p><strong>Company Name:</strong> DemoTech Pvt Ltd</p>
    <p><strong>Current Price:</strong> ₹10,000</p>
    <p><strong>Offer Valid Till:</strong> 30 April 2026</p>

    <div class="highlight">
      <p>
        DemoTech provides AI-powered chatbot solutions for customer support,
        website automation, and knowledge-based assistants.
      </p>
    </div>

    <footer>
      &copy; 2026 DemoTech Pvt Ltd. All rights reserved.
    </footer>
  </div>

</html>
